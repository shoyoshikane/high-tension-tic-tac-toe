name: Test and build native apps
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.47.7'
          cache: true
      - run: bash tool/bootstrap.sh
        working-directory: native
      - run: dart format --output=none --set-exit-if-changed lib test
        working-directory: native
      - run: flutter analyze
        working-directory: native
      - run: flutter test
        working-directory: native
      - run: flutter build apk --debug
        working-directory: native
      - uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: native/build/app/outputs/flutter-apk/app-debug.apk
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: flutter-source
          path: |
            native/lib/
            native/test/
            native/android/
            native/ios/
            native/pubspec.*
            native/.metadata
          include-hidden-files: true
  ios:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.47.7'
          cache: true
      - run: bash tool/bootstrap.sh
        working-directory: native
      - run: flutter build ios --simulator
        working-directory: native
      - uses: actions/upload-artifact@v4
        with:
          name: ios-simulator
          path: native/build/ios/iphonesimulator/Runner.app
